# 销售订单部分
saleOrder:
 tag: 销售订单
 field:
  id: ID
  frame: 组织
  customer: 客户
  time: 单据时间
  number: 单据编号
  total: 单据金额
  actual: 实际金额
  people: 关联人员
  arrival: 到货日期
  logistics: 物流信息
  file: 单据附件
  data: 备注信息
  more: 扩展信息
