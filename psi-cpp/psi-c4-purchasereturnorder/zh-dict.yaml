            summary: "获取指定采购退货单详情"
            description: "根据ID获取单个采购退货单的详细信息"
          add:
            summary: "新增采购退货单"
            description: "创建新的采购退货单"
          modify:
            summary: "修改指定采购退货单"
            description: "更新指定采购退货单的信息"
          delete:
            summary: "删除指定采购退货单（支持批量）"
            description: "删除单个或多个采购退货单"
purchase:
  return:
    order:
      tag: 新增采购退货单
      tag2: 删除采购退货单
      add:
        summary: 新增采购退货单
      delete:
        summary: 删除采购退货单

  # 状态枚举值说明
  status:
    examine:
      "0": "未审核"
      "1": "已审核"
    nucleus:
      "0": "未核销"
      "1": "部分核销"
      "2": "已核销"
    cse:
      "0": "未结算"
      "1": "部分结算"
      "2": "已结算"
      "3": "无需结算"
    invoice:
      "0": "未开票"
      "1": "部分开票"
      "2": "已开票"
      "3": "无需开具"
    check:
      "0": "未核对"
      "1": "已核对"

